spring.application.name=backend

# 로컬 개발용: backend/.env 파일이 있으면 그 안의 KEY=VALUE를 환경변수처럼 자동으로 읽어옴
# (파일이 없으면 optional이라 그냥 무시됨 — 배포 환경은 호스팅 대시보드의 진짜 환경변수를 씀)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/workout_tracker}
spring.datasource.username=${DATABASE_USERNAME:workout_admin}
spring.datasource.password=${DATABASE_PASSWORD:workout_local_pw}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# 스키마 변경은 이제 전부 Flyway 마이그레이션 파일로만 함(db/migration).
# baseline-on-migrate=true: 이미 테이블이 있는 기존 DB(로컬/Railway)에서는
# V1을 "이미 적용됨"으로만 기록하고 실행하지 않음. 완전히 새 DB에서만 V1이 실제로 실행됨
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

app.jwt.secret=${JWT_SECRET:local-dev-only-secret-key-please-change-before-any-deployment-0123456789}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3100}

# 운동 Q&A AI 어시스턴트. 비용 절감을 위해 저렴한 모델(Haiku) 고정 사용
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=claude-haiku-4-5
# 사용자 1명당 하루 호출 한도 (Claude API 비용 방어용)
app.assistant.rate-limit.max-per-day=30

# 구글 로그인 — 프론트에서 받은 ID 토큰을 이 Client ID를 대상(audience)으로 검증
app.google.client-id=${GOOGLE_CLIENT_ID:}
